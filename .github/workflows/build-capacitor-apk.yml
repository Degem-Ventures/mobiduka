name: Build Capacitor Android APK (Next.js UI)

on:
  workflow_dispatch:
  push:
    branches: [dev]

jobs:
  build-capacitor-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Verify launcher icon assets
        run: |
          python - <<'PY'
          from pathlib import Path

          icon_files = (
              list(Path("android/app/src/main/res").glob("mipmap-*/mobiduka_launcher*.png"))
              + list(Path("android/app/src/main/res").glob("drawable-*/mobiduka_launcher_foreground.png"))
          )
          if len(icon_files) != 15:
              raise SystemExit(f"Expected 15 launcher PNGs, found {len(icon_files)}")

          png_signature = b"\x89PNG\r\n\x1a\n"
          for icon_file in icon_files:
              if not icon_file.read_bytes().startswith(png_signature):
                  raise SystemExit(f"{icon_file} is not a PNG; Git LFS content may be missing")
          PY

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and sync Capacitor
        env:
          CAPACITOR_SERVER_URL: ${{ vars.MOBIDUKA_API_ORIGIN || 'https://mobiduka.vercel.app' }}
        run: |
          mkdir -p dist android/app/src/main/assets
          printf '<!doctype html><html><head><meta charset="utf-8"></head><body></body></html>\n' > dist/index.html
          pnpm exec cap sync android

      - name: Build debug APK
        run: gradle -p android clean assembleDebug
        # run: |
        #   cd android
        #   ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: mobiduka-capacitor-debug-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
