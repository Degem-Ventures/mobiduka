name: Build Capacitor Android APK

on:
  workflow_dispatch:
  push:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Capacitor web assets
        run: |
          mkdir -p dist
          if [ -d public ]; then cp -R public/* dist/; fi
          if [ ! -f dist/index.html ]; then
            cat > dist/index.html <<'EOF'
            <!doctype html>
            <html lang="en">
              <head>
                <meta charset="UTF-8" />
                <meta name="viewport" content="width=device-width, initial-scale=1.0" />
                <title>MobiDuka</title>
              </head>
              <body>
                <main style="font-family: sans-serif; padding: 2rem; text-align: center;">
                  <h1>MobiDuka</h1>
                  <p>Capacitor web bundle placeholder.</p>
                </main>
              </body>
            </html>
            EOF
          fi

      - name: Build and sync Capacitor
        run: pnpm run cap:sync

      - name: Build debug APK
        run: gradle -p android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: mobiduka-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk