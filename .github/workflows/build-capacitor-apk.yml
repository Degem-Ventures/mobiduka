name: Build and publish signed Capacitor Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix (for example 1.2.3)
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-capacitor-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Resolve release version
        id: release_version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must use semantic version format, for example 1.2.3."
            exit 1
          fi

          echo "version_name=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Verify launcher icon assets
        run: |
          python - <<'PY'
          from pathlib import Path

          icon_files = (
              list(Path("android/app/src/main/res").glob("mipmap-*/mobiduka_launcher*.png"))
              + list(Path("android/app/src/main/res").glob("drawable-*/mobiduka_launcher_foreground.png"))
          )
          if len(icon_files) != 15:
              raise SystemExit(f"Expected 15 launcher PNGs, found {len(icon_files)}")

          png_signature = b"\x89PNG\r\n\x1a\n"
          for icon_file in icon_files:
              if not icon_file.read_bytes().startswith(png_signature):
                  raise SystemExit(f"{icon_file} is not a PNG; Git LFS content may be missing")
          PY

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and sync Capacitor
        env:
          MOBIDUKA_API_ORIGIN: ${{ vars.MOBIDUKA_API_ORIGIN || 'https://mobiduka.vercel.app' }}
        run: |
          pnpm run build:capacitor
          pnpm exec cap sync android

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ||
                -z "$ANDROID_KEYSTORE_PASSWORD" ||
                -z "$ANDROID_KEY_ALIAS" ||
                -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::Android release signing is not configured. Add all four ANDROID_* repository secrets as described in docs/ANDROID_RELEASES.md."
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/mobiduka-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.release_version.outputs.version_name }}
        run: |
          gradle -p android clean assembleRelease \
            -PmobidukaVersionCode="$GITHUB_RUN_NUMBER" \
            -PmobidukaVersionName="$VERSION_NAME"

      - name: Verify APK signature
        run: |
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$apksigner_path" ]]; then
            echo "::error::Android apksigner tool was not found."
            exit 1
          fi
          "$apksigner_path" verify --verbose android/app/build/outputs/apk/release/app-release.apk

      - name: Write release build metadata
        env:
          VERSION_NAME: ${{ steps.release_version.outputs.version_name }}
          RELEASE_TAG: ${{ steps.release_version.outputs.tag }}
        run: |
          {
            echo "versionName=$VERSION_NAME"
            echo "versionCode=$GITHUB_RUN_NUMBER"
            echo "tag=$RELEASE_TAG"
            echo "commit=$GITHUB_SHA"
            echo "branch=$GITHUB_REF_NAME"
          } > "$RUNNER_TEMP/mobiduka-release-build-info.txt"

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: MobiDuka ${{ steps.release_version.outputs.version_name }}
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            ${{ runner.temp }}/mobiduka-release-build-info.txt
