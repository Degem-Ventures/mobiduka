name: Build Flutter iOS App

on:
  workflow_dispatch:
  push:
    branches: [dev]

jobs:
  build_flutter_ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Stabilize CocoaPods Git dependencies
        run: |
          # bluetooth_print_plus resolves GSDK from Gitee during pod install.
          # Use HTTP/1.1 and a long low-speed window because the hosted Gitee
          # repository can be slow to clone from macOS runners.
          git config --global http.version HTTP/1.1
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 600
          git config --global http.maxRequests 1

          for attempt in 1 2 3 4 5; do
            if git ls-remote https://gitee.com/besthandset/gsdk.git HEAD; then
              exit 0
            fi
            echo "Gitee dependency preflight failed (attempt ${attempt}/5); retrying..."
            sleep 10
          done

          echo "Unable to reach the GSDK repository after 5 attempts."
          exit 1

      - name: Ensure iOS project exists
        run: |
          cd flutter_app

          # 1. Generate a fresh native iOS directory tree natively
          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            flutter create --platforms=ios .
          fi

          # Keep the Podfile deterministic while loading podhelper from the Flutter SDK.
          cat << 'EOF' > ios/Podfile
          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(
              File.join('..', 'Flutter', 'Generated.xcconfig'),
              __FILE__
            )

            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist. Run flutter pub get first"
            end

            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT=(.*)/)
              return matches[1].strip if matches
            end
            raise 'FLUTTER_ROOT not found in Generated.xcconfig'
          end

          require File.expand_path(
            File.join('packages', 'flutter_tools', 'bin', 'podhelper'),
            flutter_root
          )

          flutter_ios_podfile_setup

          platform :ios, '15.0'
          use_frameworks! :linkage => :static
          use_modular_headers!

          target 'Runner' do
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))

            target 'RunnerTests' do
              inherit! :search_paths
            end
          end

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
                if target.name == 'bluetooth_print_plus'
                  config.build_settings['DEFINES_MODULE'] = 'NO'
                end
              end
            end
          end
          EOF
                      echo "✅ Successfully written a pristine, error-free Podfile template to disk!"

      - name: Install Dependencies
        run: |
          cd flutter_app
          flutter pub get
          grep -A6 '^  mobile_scanner:' pubspec.lock

      - name: Build Flutter iOS app without signing
        run: |
          cd flutter_app
          for attempt in 1 2 3; do
            if flutter build ios --simulator --debug; then
              exit 0
            fi
            echo "Flutter iOS build failed (attempt ${attempt}/3); retrying CocoaPods resolution..."
            rm -rf ios/Pods ios/Podfile.lock
            sleep 15
          done

          echo "Flutter iOS build failed after 3 attempts."
          exit 1

      - name: Upload iOS Simulator Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobiduka-flutter-ios-debug
          path: flutter_app/build/ios/iphonesimulator/Runner.app
