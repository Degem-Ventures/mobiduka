name: Build Flutter iOS App

on:
  workflow_dispatch:
  push:
    branches: [dev]

jobs:
  build_flutter_ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Ensure iOS project exists
        run: |
          cd flutter_app
          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            flutter create --platforms=ios .
          fi

          python3 - <<'PY'
          import re
          from pathlib import Path

          podfile_path = Path("ios/Podfile")
          if not podfile_path.exists():
              print("Podfile does not exist yet.")
              exit(0)

          text = podfile_path.read_text()

          # 1. Enforce global modular headers explicitly
          if "use_modular_headers!" not in text:
              text = "use_modular_headers!\n" + text

          # 2. Force explicit iOS platform targets to satisfy CocoaPods
          if "platform :ios" not in text:
              text = "platform :ios, '15.0'\n" + text

          # 3. Completely wipe out any pre-existing post_install macro blocks 
          # to prevent duplicate closures or legacy undefined 'target' crashes.
          text = re.sub(r"post_install\s+do\s+\|installer\|.*?end", "", text, flags=re.DOTALL)

          # 4. Append a clean, fully-formed, error-free post_install hook block
          clean_post_install = """
            post_install do |installer|
              # Project-level global configurations
              installer.pods_project.build_configurations.each do |config|
                config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
              end
              # Target-level module configurations
              installer.pod_targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
                  config.build_settings['DEFINES_MODULE'] = 'YES'
                  config.build_settings['CLANG_ENABLE_MODULES'] = 'YES'
                end
              end
            end
            """
            text += clean_post_install
            podfile_path.write_text(text)
            print("Successfully stripped old hooks and injected a clean post_install block.")
            PY

      - name: Install Dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Build Flutter iOS app without signing
        run: |
          cd flutter_app
          flutter build ios --no-codesign --debug

      - name: Upload iOS Simulator Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobiduka-flutter-ios-debug
          path: flutter_app/build/ios/iphoneos/Runner.app
