name: Build Flutter iOS App

on:
  workflow_dispatch:
  push:
    branches: [dev]

jobs:
  build_flutter_ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ensure iOS project exists
        run: |
          cd flutter_app
          
          # 1. Generate the base project tree layers natively using Flutter toolchains
          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            flutter create --platforms=ios .
          fi

          # 2. Extract dependencies to fully expand local build templates
          flutter pub get

          # 3. Patch the natively generated Podfile directly in-place
          if [ -f ios/Podfile ]; then
            # Enforce modern platform deployment configurations
            sed -i '' "s/# platform :ios, '12.0'/platform :ios, '15.0'/g" ios/Podfile
            
            # Inject Project-level non-modular settings right below the native post_install signature row
            sed -i '' "s/post_install do |installer|/post_install do |installer|\n  if installer.respond_to?(:pods_project) \&\& installer.pods_project\n    installer.pods_project.build_configurations.each { |c| c.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES' }\n  end/g" ios/Podfile

            # Inject Target-level module rules directly inside the native target compilation loop
            sed -i '' "s/flutter_additional_ios_build_settings(target)/flutter_additional_ios_build_settings(target)\n    target.build_configurations.each do |config|\n      config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'\n      config.build_settings['DEFINES_MODULE'] = 'YES'\n      config.build_settings['CLANG_ENABLE_MODULES'] = 'YES'\n    end/g" ios/Podfile
            
            echo "✅ Successfully linked clean hardware configuration overrides inside Podfile parameters."
          fi

      - name: Install Dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Build Flutter iOS app without signing
        run: |
          cd flutter_app
          flutter build ios --no-codesign --debug

      - name: Upload iOS Simulator Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobiduka-flutter-ios-debug
          path: flutter_app/build/ios/iphoneos/Runner.app
