name: Build Flutter iOS App

on:
  workflow_dispatch:
  push:
    branches: [dev]

jobs:
  build_flutter_ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ensure iOS project exists
        run: |
          cd flutter_app
          
          # 1. Force scaffolding of native platform wrappers if missing
          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            flutter create --platforms=ios .
          fi

          # 2. Force Flutter to evaluate and safely resolve all native pod helper toolchains
          flutter pub get

          # 3. Apply the critical deployment baseline and patch the valid Podfile in-place
          if [ -f ios/Podfile ]; then
            # Set target deployment platform baseline safely
            sed -i '' "s/# platform :ios, '12.0'/platform :ios, '15.0'/g" ios/Podfile
            
            # Inject our Project-level non-modular settings right below the post_install hook definition row
            sed -i '' "s/post_install do |installer|/post_install do |installer|\\
            installer.pods_project.build_configurations.each do |config|\\
              config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'\\
            end/g" ios/Podfile

                      # Inject our Target-level non-modular, module definition, and Clang variables inside the target loop
                      sed -i '' "s/flutter_additional_ios_build_settings(target)/flutter_additional_ios_build_settings(target)\\
              target.build_configurations.each do |config|\\
                config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'\\
                config.build_settings['DEFINES_MODULE'] = 'YES'\\
                config.build_settings['CLANG_ENABLE_MODULES'] = 'YES'\\
              end/g" ios/Podfile
                      
                      echo "✅ Successfully injected hardware non-modular compilation settings into the native Flutter Podfile!"
                    fi

      - name: Install Dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Build Flutter iOS app without signing
        run: |
          cd flutter_app
          flutter build ios --no-codesign --debug

      - name: Upload iOS Simulator Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobiduka-flutter-ios-debug
          path: flutter_app/build/ios/iphoneos/Runner.app
