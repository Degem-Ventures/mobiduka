name: Build Flutter iOS App

on:
  workflow_dispatch:
  push:
    branches: [dev]

jobs:
  build_flutter_ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ensure iOS project exists
        run: |
          cd flutter_app
          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            flutter create --platforms=ios .
          fi

          python3 - <<'PY'
          import re
          from pathlib import Path

          podfile_path = Path("ios/Podfile")
          if not podfile_path.exists():
              print("Podfile does not exist yet.")
              exit(0)

          text = podfile_path.read_text()
          
          # 1. Enforce global modular headers explicitly
          if "use_modular_headers!" not in text:
              text = "use_modular_headers!\n" + text

          # 2. Advanced Injection: Relax module checks across ALL configuration blocks
          # This forces Xcode to accept non-modular header imports inside third-party binary frameworks
          build_settings_injection = """
              # Project-level target compilation settings
              installer.pods_project.build_configurations.each do |config|
                config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
              end
              # Isolated library-level target compilation settings
              installer.pod_targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
                  config.build_settings['DEFINES_MODULE'] = 'YES'
                  config.build_settings['CLANG_ENABLE_MODULES'] = 'YES'
                end
              end
          """
          
          # Match post_install block syntax variants safely
          post_install_regex = r"(post_install\s+do\s+\|installer\|)"
          if re.search(post_install_regex, text):
              text = re.sub(post_install_regex, r"\1" + build_settings_injection, text, count=1)
              print("Successfully injected dual-layer non-modular header overrides.")
          else:
              text += f"\npost_install do |installer|{build_settings_injection}end\n"
              print("Created a new structural post_install hook configuration.")

          podfile_path.write_text(text)
          PY

      - name: Install Dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Build Flutter iOS app without signing
        run: |
          cd flutter_app
          flutter build ios --no-codesign --debug

      - name: Upload iOS Simulator Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobiduka-flutter-ios-debug
          path: flutter_app/build/ios/iphoneos/Runner.app
