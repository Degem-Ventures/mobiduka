name: Build Flutter iOS App

on:
  workflow_dispatch:
  push:
    branches: [dev]

jobs:
  build_flutter_ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ensure iOS project exists
        run: |
          cd flutter_app
          
          # 1. Generate the base project tree layers natively using Flutter toolchains
          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            flutter create --platforms=ios .
          fi

          # 2. Extract dependencies to fully expand local build templates
          flutter pub get

          # 3. Patch the natively generated Podfile directly in-place using a stable Ruby script block
          # This avoids BSD sed parsing mutations completely
          if [ -f ios/Podfile ]; then
            ruby -e "
            podfile_path = 'ios/Podfile'
            lines = File.read(podfile_path)

            # Enforce modern platform deployment configurations
            lines.gsub!(/# platform :ios, '12.0'/, \"platform :ios, '15.0'\")

            # Project-level non-modular settings injection
            project_rule = \"post_install do |installer|\\n  if installer.respond_to?(:pods_project) && installer.pods_project\\n    installer.pods_project.build_configurations.each { |c| c.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES' }\\n  end\"
            lines.gsub!(/post_install do \|installer\|/, project_rule)

            # Target-level plugin non-modular, module definition, and Clang variables injection
            target_rule = \"flutter_additional_ios_build_settings(target)\\n    target.build_configurations.each do |config|\\n      config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'\\n      config.build_settings['DEFINES_MODULE'] = 'YES'\\n      config.build_settings['CLANG_ENABLE_MODULES'] = 'YES'\\n    end\"
            lines.gsub!(/flutter_additional_ios_build_settings\(target\)/, target_rule)

            File.write(podfile_path, lines)
            puts '✅ Successfully applied hardware non-modular compilation settings to Podfile!'
            "
          fi

      - name: Install Dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Build Flutter iOS app without signing
        run: |
          cd flutter_app
          flutter build ios --no-codesign --debug

      - name: Upload iOS Simulator Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobiduka-flutter-ios-debug
          path: flutter_app/build/ios/iphoneos/Runner.app
