name: Build Flutter iOS App

on:
  workflow_dispatch:
  push:
    branches: [dev]

jobs:
  build_flutter_ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ensure iOS project exists
        run: |
          cd flutter_app
          
          # 1. Let Flutter natively generate the pristine, valid Podfile template structure
          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            flutter create --platforms=ios .
          fi

          # Move into the native ios wrapper directory context
          cd ios
          
          # Trigger initial mock pod setup parameters so that the local Podfile is fully expanded
          flutter pub get

          # 2. Force the explicit modern baseline deployment platform target
          sed -i '' "s/# platform :ios, '12.0'/platform :ios, '15.0'/g" Podfile

          # 3. Inject an absolute global module override block into the natively generated Podfile.
          # This replaces the default placeholder macro loop safely using a Ruby text-swap stream.
          ruby -e '
          podfile = "Podfile"
          content = File.read(podfile)
          
          project_injection = "
            # Global compilation settings injected by MobiDuka POS pipeline
            installer.pods_project.build_configurations.each do |config|
              config.build_settings[\"CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES\"] = \"YES\"
            end
            installer.aggregate_targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.user_project.build_configurations.each do |config|
                config.build_settings[\"CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES\"] = \"YES\"
                config.build_settings[\"DEFINES_MODULE\"] = \"YES\"
                config.build_settings[\"CLANG_ENABLE_MODULES\"] = \"YES\"
              end
            end"

          if content.include?("flutter_additional_ios_build_settings(target)") && !content.include?("CLANG_ALLOW_NON_MODULAR_INCLUDES")
            # Clear the old structural post_install macro sequence to prevent duplicate block crashes
            content.gsub!(/post_install\s+do\s+\|installer\|.*?end/m, "")
            # Append the clean unified framework compilation rules block safely to the bottom
            content += \"\npost_install do |installer|\\n#{project_injection}\\nend\\n\"
            File.write(podfile, content)
            puts "Successfully patched the native post_install block settings."
          end
          '

      - name: Install Dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Build Flutter iOS app without signing
        run: |
          cd flutter_app
          flutter build ios --no-codesign --debug

      - name: Upload iOS Simulator Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobiduka-flutter-ios-debug
          path: flutter_app/build/ios/iphoneos/Runner.app
