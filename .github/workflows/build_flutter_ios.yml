name: Build Flutter iOS App

on:
  workflow_dispatch:
  push:
    branches: [dev]

jobs:
  build_flutter_ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ensure iOS project exists
        run: |
          cd flutter_app
          
          # 1. Generate a fresh native iOS directory tree natively
          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            flutter create --platforms=ios .
          fi

          # 2. Complete a clean overwrite to avoid sed mutations or duplicate block collisions
          # This incorporates the explicit platform target and load macros required by Flutter
          cat << 'EOF' > ios/Podfile
            # Load Flutter shared utilities natively to declare internal macros
            flutter_shared_utils = File.expand_path(File.join('..', 'Flutter', 'podhelper.rb'), __FILE__)
            if File.exist?(flutter_shared_utils)
              load flutter_shared_utils
            else
              load File.expand_path(File.join('Flutter', 'podhelper.rb'), __FILE__)
            end

            platform :ios, '15.0'

            use_modular_headers!

            target 'Runner' do
              use_frameworks!
              use_modular_headers!
              
              flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
              
              target 'RunnerTests' do
                inherit! :search_paths
              end
            end

            post_install do |installer|
              # A. Project-level global configurations
              installer.pods_project.build_configurations.each do |config|
                config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
              end
              
              # B. Target-level module configurations (Forces mobile_scanner & printing plugins to compile safely)
              installer.aggregate_targets.each do |target|
                flutter_additional_ios_build_settings(target)
                target.user_project.build_configurations.each do |config|
                  config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
                  config.build_settings['DEFINES_MODULE'] = 'YES'
                  config.build_settings['CLANG_ENABLE_MODULES'] = 'YES'
                end
              end
            end
            EOF
                      echo "✅ Successfully written a pristine, error-free Podfile template to disk!"

      - name: Install Dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Build Flutter iOS app without signing
        run: |
          cd flutter_app
          flutter build ios --no-codesign --debug

      - name: Upload iOS Simulator Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobiduka-flutter-ios-debug
          path: flutter_app/build/ios/iphoneos/Runner.app
