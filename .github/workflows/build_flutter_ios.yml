name: Build Flutter iOS App

on:
  workflow_dispatch:
  push:
    branches: [dev]

jobs:
  build_flutter_ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Ensure iOS project exists
        run: |
          cd flutter_app

          # 1. Allow Flutter to natively spin up the base iOS directory trees
          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            flutter create --platforms=ios .
          fi

          #name: Build Flutter iOS App

          on:
            workflow_dispatch:
            push:
              branches: [dev]

          jobs:
            build_flutter_ios:
              runs-on: macos-latest

              steps:
                - name: Checkout Code
                  uses: actions/checkout@v4

                - name: Set up Flutter
                  uses: subosito/flutter-action@v2
                  with:
                    channel: "stable"

                - name: Ensure iOS project exists
                  run: |
                    cd flutter_app

                    # 1. Let Flutter natively generate the base directory tree layout structure
                    if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
                      flutter create --platforms=ios .
                    fi

                    # 2. Force Flutter toolchain initialization to populate the baseline template
                    flutter pub get

                    # 3. Apply the critical deployment baseline and rewrite the post_install hook safely
                    if [ -f ios/Podfile ]; then
                      # Fix target baseline deployment platform safely
                      sed -i '' "s/# platform :ios, '12.0'/platform :ios, '15.0'/g" ios/Podfile
                      
                      ruby -e '
                      podfile_path = "ios/Podfile"
                      text = File.read(podfile_path)

                      # Define our custom non-modular framework exclusions
                      custom_build_settings = "
                        installer.pods_project.build_configurations.each do |config|
                          config.build_settings[\"CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES\"] = \"YES\"
                        end
                        installer.aggregate_targets.each do |target|
                          flutter_additional_ios_build_settings(target)
                          target.user_project.build_configurations.each do |config|
                            config.build_settings[\"CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES\"] = \"YES\"
                            config.build_settings[\"DEFINES_MODULE\"] = \"YES\"
                            config.build_settings[\"CLANG_ENABLE_MODULES\"] = \"YES\"
                          end
                        end"

                                  # Strip any existing post_install blocks entirely to prevent duplicate definition collisions
                                  text.gsub!(/post_install\s+do\s+\|installer\|.*?end/m, "")

                                  # Append the clean unified framework compilation rules block safely to the bottom
                                  text += \"\npost_install do |installer|#{custom_build_settings}\nend\n\"

                                  File.write(podfile_path, text)
                                  puts "Successfully stripped duplicate blocks and injected new post_install rules."
                                  '
                                fi

                            - name: Install Dependencies
                              run: |
                                cd flutter_app
                                flutter pub get

                            - name: Build Flutter iOS app without signing
                              run: |
                                cd flutter_app
                                flutter build ios --no-codesign --debug

                            - name: Upload iOS Simulator Build Artifact
                              uses: actions/upload-artifact@v4
                              with:
                                name: mobiduka-flutter-ios-debug
                                path: flutter_app/build/ios/iphoneos/Runner.app
                      2. Force Flutter toolchain initialization to populate the baseline Podfile template
                                flutter pub get

                                # 3. Inject our required configurations straight inside the existing post_install macro container
                                # This completely avoids duplicate block conflicts or string truncation errors
                                if [ -f ios/Podfile ]; then
                                  sed -i '' "s/# platform :ios, '12.0'/platform :ios, '15.0'/g" ios/Podfile
                                  
                                  ruby -e '
                                  file_path = "ios/Podfile"
                                  content = File.read(file_path)
                                  
                                  # Injection block containing strict non-modular and framework definition criteria
                                  custom_build_settings = "
                                  installer.pods_project.build_configurations.each do |config|
                                    config.build_settings[\"CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES\"] = \"YES\"
                                  end
                                  installer.pod_targets.each do |target|
                                    target.build_configurations.each do |config|
                                      config.build_settings[\"CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES\"] = \"YES\"
                                      config.build_settings[\"DEFINES_MODULE\"] = \"YES\"
                                      config.build_settings[\"CLANG_ENABLE_MODULES\"] = \"YES\"
                                    end
                                  end"
                                            
                                            # Target the existing block parameter row and map our configurations safely inside it
                                            if content.include?("post_install do |installer|") && !content.include?("CLANG_ALLOW_NON_MODULAR_INCLUDES")
                                              content.gsub!("post_install do |installer|", "post_install do |installer|#{custom_build_settings}")
                                              File.write(file_path, content)
                                              puts "🎉 Successfully combined build overrides into the native post_install block!"
                                            end
                                            '
                                          fi

                - name: Install Dependencies
                  run: |
                    cd flutter_app
                    flutter pub get

                - name: Build Flutter iOS app without signing
                  run: |
                    cd flutter_app
                    flutter build ios --no-codesign --debug

                - name: Upload iOS Simulator Build Artifact
                  uses: actions/upload-artifact@v4
                  with:
                    name: mobiduka-flutter-ios-debug
                    path: flutter_app/build/ios/iphoneos/Runner.app
