name: Build Flutter iOS App

on:
  workflow_dispatch:
  push:
    branches: [dev]

jobs:
  build_flutter_ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ensure iOS project exists
        run: |
          cd flutter_app
          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            flutter create --platforms=ios .
          fi

          # 1. Enforce global deployment targets and modular headers constraints
          if [ -f ios/Podfile ]; then
            sed -i '' "s/# platform :ios, '12.0'/platform :ios, '15.0'/g" ios/Podfile
            if ! grep -q "use_modular_headers!" ios/Podfile; then
              printf "use_modular_headers!\n$(cat ios/Podfile)" > ios/Podfile
            fi

            # 2. Inject an absolute global module override block directly into the Podfile.
            # Fixed: Replaced raw target hooks with an internal configuration override pattern
            ruby -e '
            podfile = "ios/Podfile"
            content = File.read(podfile)
            
            project_injection = "
              installer.pods_project.build_configurations.each do |config|
                config.build_settings[\"CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES\"] = \"YES\"
              end
              installer.aggregate_targets.each do |target|
                flutter_additional_ios_build_settings(target)
                target.user_project.build_configurations.each do |config|
                  config.build_settings[\"CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES\"] = \"YES\"
                  config.build_settings[\"DEFINES_MODULE\"] = \"YES\"
                  config.build_settings[\"CLANG_ENABLE_MODULES\"] = \"YES\"
                end
              end"

            if content.include?("flutter_additional_ios_build_settings(target)") && !content.include?("CLANG_ALLOW_NON_MODULAR_INCLUDES")
              # Completely remove the raw un-encapsulated native loop block placeholder
              content.gsub!(/post_install\s+do\s+\|installer\|.*?end/m, "")
              # Append a clean, fully-formed, error-free post_install block to the end of the file
              content += \"\npost_install do |installer|\\n#{project_injection}\\nend\\n\"
              File.write(podfile, content)
              puts "Successfully patched the native post_install block."
            end
            '
          fi

      - name: Install Dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Build Flutter iOS app without signing
        run: |
          cd flutter_app
          flutter build ios --no-codesign --debug

      - name: Upload iOS Simulator Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobiduka-flutter-ios-debug
          path: flutter_app/build/ios/iphoneos/Runner.app
