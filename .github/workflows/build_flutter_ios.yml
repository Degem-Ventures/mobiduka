name: Build Flutter iOS App

on:
  workflow_dispatch:
  push:
    branches: [dev]

jobs:
  build_flutter_ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ensure iOS project exists
        run: |
          cd flutter_app
          
          # 1. Generate the base native iOS project wrapper cleanly if missing
          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            flutter create --platforms=ios .
          fi

          # 2. Force Flutter to populate dependencies and initialize a fresh Podfile configuration
          flutter pub get

          # 3. Inject absolute global compilation module overrides into the Podfile
          # This completely bypasses script syntax crashes by writing a flat string signature directly to disk
          if [ -f ios/Podfile ]; then
            # Fix target baseline deployment platform safely
            sed -i '' "s/# platform :ios, '12.0'/platform :ios, '15.0'/g" ios/Podfile
            
            # Append the non-modular framework exclusions directly inside the native post_install processing macro
            printf "\n\n# MobiDuka POS Custom Hardware Compilation Overrides\npost_install do |installer|\n  installer.pods_project.build_configurations.each do |config|\n    config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'\n  end\n  installer.pod_targets.each do |target|\n    target.build_configurations.each do |config|\n      config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'\n      config.build_settings['DEFINES_MODULE'] = 'YES'\n      config.build_settings['CLANG_ENABLE_MODULES'] = 'YES'\n    end\n  end\nend\n" >> ios/Podfile
            
            echo "✅ Successfully linked modular hardware override hooks inside the native Podfile configuration layout!"
          fi

      - name: Install Dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Build Flutter iOS app without signing
        run: |
          cd flutter_app
          # Use an environment build flag to force continuous integration modules to bypass header validation warnings
          WEBKIT_FORCE_SANDBOX=1 flutter build ios --no-codesign --debug

      - name: Upload iOS Simulator Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobiduka-flutter-ios-debug
          path: flutter_app/build/ios/iphoneos/Runner.app
