name: Build Flutter iOS App

on:
  workflow_dispatch:
  push:
    branches: [dev]

jobs:
  build_flutter_ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ensure iOS project exists
        run: |
          cd flutter_app
          
          # 1. Generate the base project directory wrapper natively
          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            flutter create --platforms=ios .
          fi

          # 2. Force Flutter to populate dependencies and initialize the baseline Podfile configuration
          flutter pub get

          # 3. Create a dedicated standalone, type-safe Ruby override script.
          # This separates custom non-modular parameters cleanly from the main Podfile structure.
          cat << 'EOF' > ios/pod_overrides.rb
          def apply_mobiduka_custom_build_settings(installer)
            puts "🚀 Injecting MobiDuka POS Custom Hardware Compilation Overrides..."
            
            # A. Project-level global configurations
            if installer.respond_to?(:pods_project) && installer.pods_project
              installer.pods_project.build_configurations.each do |config|
                config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
              end
            end
            
            # B. Target-level module configurations (Forces mobile_scanner & printing plugins to compile safely)
            if installer.respond_to?(:pod_targets) && installer.pod_targets
              installer.pod_targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
                  config.build_settings['DEFINES_MODULE'] = 'YES'
                  config.build_settings['CLANG_ENABLE_MODULES'] = 'YES'
                end
              end
            end
          end
          EOF

                    # 4. Inject a lightweight file hook reference at the top and INSIDE the native post_install block.
                    # This prevents multiple post_install block collisions.
                    if [ -f ios/Podfile ]; then
                      # Fix target baseline deployment platform safely
                      sed -i '' "s/# platform :ios, '12.0'/platform :ios, '15.0'/g" ios/Podfile
                      
                      # Require our standalone override script at the very top of the Podfile template
                      printf "require_relative 'pod_overrides.rb'\n$(cat ios/Podfile)" > ios/Podfile
                      
                      # Use a robust inline script to inject our method call inside the native post_install block safely
                      python3 - <<'PY'
                      import re
                      from pathlib import Path

                      podfile_path = Path("ios/Podfile")
                      text = podfile_path.read_text()

                      # Find the start of the native post_install block and append our custom hook immediately below it
                      pattern = r"(post_install\s+do\s+\|installer\|)"
                      replacement = r"\1\n  apply_mobiduka_custom_build_settings(installer)"

                      if re.search(pattern, text):
                          text = re.sub(pattern, replacement, text, count=1)
                          podfile_path.write_text(text)
                          print("✅ Successfully wired the override trigger into the existing post_install macro container.")
                      else:
                          print("⚠️ Native post_install block not found. Appending standard block as fallback.")
                          text += "\npost_install do |installer|\n  apply_mobiduka_custom_build_settings(installer)\nend\n"
                          podfile_path.write_text(text)
                      PY
                    fi

      - name: Install Dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Build Flutter iOS app without signing
        run: |
          cd flutter_app
          flutter build ios --no-codesign --debug

      - name: Upload iOS Simulator Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobiduka-flutter-ios-debug
          path: flutter_app/build/ios/iphoneos/Runner.app
