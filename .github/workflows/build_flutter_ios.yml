name: Build Flutter iOS App

on:
  workflow_dispatch:
  push:
    branches: [dev]

jobs:
  build_flutter_ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ensure iOS project exists
        run: |
          cd flutter_app
          
          # 1. Generate the base project tree layers natively using Flutter toolchains
          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            flutter create --platforms=ios .
          fi

          # 2. Extract dependencies to fully expand local build templates
          flutter pub get

          # 3. Patch the natively generated Podfile directly in-place using an explicit, target-scoped Ruby script block
          if [ -f ios/Podfile ]; then
            ruby -e "
            podfile_path = 'ios/Podfile'
            lines = File.read(podfile_path)

            # Enforce modern platform deployment configurations
            lines.gsub!(/# platform :ios, '12.0'/, \"platform :ios, '15.0'\")

            # Deep target iteration script block targeting individual third-party plugin containers directly
            target_rule = \"flutter_additional_ios_build_settings(target)
            # Deep patch injected by MobiDuka POS pipeline
            installer.pod_targets.each do |pod_target|
              pod_target.build_configurations.each do |config|
                config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
                config.build_settings['DEFINES_MODULE'] = 'YES'
                config.build_settings['CLANG_ENABLE_MODULES'] = 'YES'
              end
            end
            installer.pods_project.build_configurations.each do |config|
              config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
            end\"

            # Perform the safe regex swap replacement
            lines.gsub!(/flutter_additional_ios_build_settings\(target\)/, target_rule)

            File.write(podfile_path, lines)
            puts '✅ Successfully applied isolated plugin non-modular rules to individual framework sandboxes!'
            "
          fi

      - name: Install Dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Build Flutter iOS app without signing
        run: |
          cd flutter_app
          flutter build ios --no-codesign --debug

      - name: Upload iOS Simulator Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobiduka-flutter-ios-debug
          path: flutter_app/build/ios/iphoneos/Runner.app
