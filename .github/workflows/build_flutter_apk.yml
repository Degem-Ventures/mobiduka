name: Build Flutter Android APK

on:
  workflow_dispatch:
  push:
    branches: [dev]

jobs:
  build_flutter_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Ensure Android project exists
        run: |
          cd flutter_app
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android .
          fi

      - name: Install Dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Build Release APK
        env:
          # Public endpoint: set this as a GitHub Actions repository variable.
          MOBIDUKA_API_ORIGIN: ${{ vars.MOBIDUKA_API_ORIGIN }}
          # DSNs are safe to embed in clients, but keep the value in Actions secrets.
          SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_ENVIRONMENT: production
        run: |
          cd flutter_app
          flutter build apk --release \
            --dart-define=MOBIDUKA_API_ORIGIN="$MOBIDUKA_API_ORIGIN" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=SENTRY_ENVIRONMENT="$SENTRY_ENVIRONMENT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobiduka-flutter-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
