name: Build Flutter Android APK

on:
  workflow_dispatch:
  push:
    branches: [dev]

jobs:
  build_flutter_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Ensure Android project exists
        run: |
          cd flutter_app
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android .
          fi

      - name: Install Dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Align legacy printer plugin SDK
        run: |
          plugin_gradle="$(find "${PUB_CACHE:-$HOME/.pub-cache}/hosted/pub.dev" -path '*/bluetooth_print_plus-*/android/build.gradle' -print -quit)"
          if [ -z "$plugin_gradle" ]; then
            echo "bluetooth_print_plus Android Gradle file was not found."
            exit 1
          fi
          # bluetooth_print_plus 2.4.6 pins API 31, while its AndroidX
          # dependencies require API 34+. Patch it before Gradle evaluates it.
          sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/' "$plugin_gradle"
          grep -q 'compileSdkVersion 36' "$plugin_gradle"

      - name: Build Release APK
        env:
          # Public endpoint: set this as a GitHub Actions repository variable.
          MOBIDUKA_API_ORIGIN: ${{ vars.MOBIDUKA_API_ORIGIN }}
          # DSNs are safe to embed in clients, but keep the value in Actions secrets.
          SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_ENVIRONMENT: production
        run: |
          cd flutter_app
          set -o pipefail
          if ! flutter build apk --release \
            --dart-define=MOBIDUKA_API_ORIGIN="$MOBIDUKA_API_ORIGIN" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=SENTRY_ENVIRONMENT="$SENTRY_ENVIRONMENT" \
            2>&1 | tee "$RUNNER_TEMP/flutter-apk-build.log"; then
            echo "::group::Flutter build failure summary"
            grep -i -E -C 12 'FAILURE:|What went wrong|Execution failed|BUILD FAILED|error:|Exception|Caused by:' \
              "$RUNNER_TEMP/flutter-apk-build.log" || true
            echo "::endgroup::"
            exit 1
          fi

      - name: Upload Flutter build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk-build-log
          path: ${{ runner.temp }}/flutter-apk-build.log
          if-no-files-found: ignore

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobiduka-flutter-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
