name: Build Flutter Android APK

on:
  workflow_dispatch:
  push:
    branches: [dev]

jobs:
  build_flutter_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Ensure Android project exists
        run: |
          cd flutter_app
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android .
          fi

          # Force app compilation SDK targets up to API level 36
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
          fi

          # Intercept plugin dependencies to ensure they inherit identical API level parameters
          # Fix: uses targetSdk assignment for Kotlin DSL block mapping
          if [ -f android/build.gradle.kts ]; then
            if ! grep -q "subprojects" android/build.gradle.kts; then
              cat >> android/build.gradle.kts <<'KOTLIN'

            subprojects {
              plugins.withId("com.android.application") {
                extensions.configure<com.android.build.api.dsl.ApplicationExtension> {
                  compileSdk = 36
                  buildToolsVersion = "36.0.0"
                  defaultConfig {
                    targetSdk = 36
                  }
                }
              }
              plugins.withId("com.android.library") {
                extensions.configure<com.android.build.api.dsl.LibraryExtension> {
                  compileSdk = 36
                  buildToolsVersion = "36.0.0"
                  defaultConfig {
                    targetSdk = 36
                  }
                }
              }
            }
            KOTLIN
                        fi
                      else
                        if ! grep -q "subprojects" android/build.gradle; then
                          cat >> android/build.gradle <<'GRADLE'

            subprojects {
              afterEvaluate { project ->
                if (project.hasProperty('android')) {
                  project.android {
                    compileSdkVersion 36
                    buildToolsVersion "36.0.0"
                    defaultConfig {
                      targetSdkVersion 36
                    }
                  }
                }
              }
            }
            GRADLE
                        fi
                      fi

      - name: Install Dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Build Release APK
        run: |
          cd flutter_app
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobiduka-flutter-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
