name: Build Flutter Android APK

on:
  workflow_dispatch:
  push:
    branches: [dev]

jobs:
  build_flutter_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Ensure Android project exists
        run: |
          cd flutter_app
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android .
          fi

      - name: Install Dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Align Android plugin SDKs
        run: |
          node <<'NODE'
          const fs = require('fs');
          const registry = JSON.parse(fs.readFileSync('flutter_app/.flutter-plugins-dependencies', 'utf8'));
          let patched = 0;

          for (const plugin of registry.plugins.android ?? []) {
            for (const filename of ['android/build.gradle', 'android/build.gradle.kts']) {
              const gradleFile = `${plugin.path}/${filename}`;
              if (!fs.existsSync(gradleFile)) continue;

              const source = fs.readFileSync(gradleFile, 'utf8');
              const updated = source
                // Only replace hard-coded legacy SDK levels. Variable-based
                // declarations (for example, flutter.compileSdkVersion) must
                // remain intact for their plugin's Gradle DSL.
                .replace(/compileSdkVersion\s+(?:31|32|33)\b/g, 'compileSdkVersion 36')
                .replace(/compileSdk\s*=\s*(?:31|32|33)\b/g, 'compileSdk = 36');
              if (updated !== source) {
                fs.writeFileSync(gradleFile, updated);
                patched += 1;
                console.log(`Aligned ${plugin.name} to compileSdk 36.`);
              }
            }
          }

          if (patched === 0) {
            throw new Error('No Android plugin compileSdk declarations were found to align.');
          }
          NODE

      - name: Build Release APK
        env:
          # Public endpoint: set this as a GitHub Actions repository variable.
          MOBIDUKA_API_ORIGIN: ${{ vars.MOBIDUKA_API_ORIGIN }}
          # DSNs are safe to embed in clients, but keep the value in Actions secrets.
          SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_ENVIRONMENT: production
        run: |
          cd flutter_app
          set -o pipefail
          if ! flutter build apk --release \
            --dart-define=MOBIDUKA_API_ORIGIN="$MOBIDUKA_API_ORIGIN" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=SENTRY_ENVIRONMENT="$SENTRY_ENVIRONMENT" \
            2>&1 | tee "$RUNNER_TEMP/flutter-apk-build.log"; then
            echo "::group::Flutter build failure summary"
            grep -i -E -C 12 'FAILURE:|What went wrong|Execution failed|BUILD FAILED|error:|Exception|Caused by:' \
              "$RUNNER_TEMP/flutter-apk-build.log" || true
            echo "::endgroup::"
            exit 1
          fi

      - name: Upload Flutter build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk-build-log
          path: ${{ runner.temp }}/flutter-apk-build.log
          if-no-files-found: ignore

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobiduka-flutter-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
