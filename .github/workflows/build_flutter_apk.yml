name: Build Flutter Android APK

on:
  workflow_dispatch:
  push:
    branches: [dev]

jobs:
  build_flutter_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Ensure Android project exists
        run: |
          cd flutter_app
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android .
          fi

          # 1. Force the main mobile application module properties up to SDK 36
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
          fi

          # 2. Inject an absolute global compilation SDK override hook into the root Gradle script.
          # Fix: Uses safe reflection property setter injection to sidestep Kotlin type casting bugs
          if [ -f android/build.gradle.kts ]; then
            cat >> android/build.gradle.kts <<'EOF'
          subprojects {
              afterEvaluate {
                  if (project.hasProperty("android")) {
                      val androidExt = project.extensions.findByName("android") as? com.android.build.gradle.BaseExtension
                      androidExt?.let {
                          it.compileSdkVersion(36)
                          it.buildToolsVersion("36.0.0")
                          it.defaultConfig.targetSdkVersion(36)
                      }
                  }
              }
          }
          EOF
                    else
                      cat >> android/build.gradle <<'EOF'
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                          buildToolsVersion "36.0.0"
                          defaultConfig {
                              targetSdkVersion 36
                          }
                      }
                  }
              }
          }
          EOF
          fi

      - name: Install Dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Build Release APK
        run: |
          cd flutter_app
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobiduka-flutter-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
