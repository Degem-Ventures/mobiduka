name: Deploy Full-Stack Backend API to Vercel

on:
  push:
    branches: [dev, main]

jobs:
  deploy_vercel_cloud:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js runtime environment
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm Package Manager
        uses: pnpm/action-setup@v4

      - name: Install Runtime Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Production Prisma Client Database Model Maps
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Install Vercel CLI Toolchain
        run: pnpm add --global vercel

      # Direct Atomic Compilation and Cloud Release Dispatch
      # This completely bypasses 'vercel pull' and handles project parameters natively
      - name: Compile and Deploy Production Application
        run: vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
