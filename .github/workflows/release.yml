name: Deploy Full-Stack Backend API to Vercel

on:
  push:
    branches: [dev, main]

jobs:
  deploy_vercel_cloud:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js runtime environment
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm Package Manager
        uses: pnpm/action-setup@v4

      - name: Install Runtime Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Production Prisma Client Database Model Maps
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # 🚀 UPGRADED: Atomic deployment via the official, native Vercel Action wrapper
      - name: Compile and Deploy Production Application
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod --yes'
