name: Deploy Full-Stack Backend API to Vercel

on:
  push:
    branches: [dev, main]

concurrency:
  group: deploy-and-migrate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy_vercel_cloud:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js runtime environment
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm Package Manager
        uses: pnpm/action-setup@v4

      - name: Install Runtime Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Production Prisma Client Database Model Maps
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Apply pending Prisma database migrations over a direct Neon connection
        run: |
          set -o pipefail
          if [[ -z "$DIRECT_DB_URL" ]]; then
            echo "DIRECT_DB_URL is required for Prisma migrations. Set it to Neon’s non-pooled connection string in GitHub Actions secrets."
            exit 1
          fi
          log_file=$(mktemp)
          trap 'rm -f "$log_file"' EXIT

          for attempt in 1 2 3; do
            if pnpm exec prisma migrate deploy 2>&1 | tee "$log_file"; then
              exit 0
            fi

            if ! grep -q 'P1002' "$log_file"; then
              exit 1
            fi

            if [[ "$attempt" -eq 3 ]]; then
              echo "Prisma migration lock timed out after 3 attempts."
              exit 1
            fi

            echo "Prisma migration lock is busy; retrying in 15 seconds ($attempt/3)."
            sleep 15
          done
        env:
          DATABASE_URL: ${{ secrets.DIRECT_DB_URL }}
          DIRECT_DB_URL: ${{ secrets.DIRECT_DB_URL }}

      # - name: Install Latest Vercel CLI Toolchain
      #   run: pnpm add --global vercel@latest

      # 🌟 HARDENED: Pin explicitly to the last verified stable version (578k+ downloads)
      # This bypasses the broken latest package trees entirely.
      - name: Compile and Deploy Production Application
        run: npx vercel@59.23.2 deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}" --scope="${{ secrets.VERCEL_ORG_ID }}" --project="${{ secrets.VERCEL_PROJECT_ID }}"
