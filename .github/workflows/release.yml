name: Deploy Full-Stack Backend API to Vercel

on:
  push:
    branches: [dev, main]

jobs:
  deploy_vercel_cloud:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js runtime environment
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm Package Manager
        uses: pnpm/action-setup@v4

      - name: Install Runtime Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Production Prisma Client Database Model Maps
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Install Latest Vercel CLI Toolchain
        run: pnpm add --global vercel@latest

      # 🌟 REPAIRED: Inline Parameter Flag Injection Bypasses Environment Parsing
      - name: Compile and Deploy Production Application
        run: vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}" --scope="${{ secrets.VERCEL_ORG_ID }}" --with-project="${{ secrets.VERCEL_PROJECT_ID }}"
