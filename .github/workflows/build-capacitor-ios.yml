name: Build Capacitor iOS App

on:
  workflow_dispatch:
  push:
    branches: [dev]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Capacitor web assets
        run: |
          mkdir -p dist
          if [ -d public ]; then
            cp -R public/. dist/
          fi
          python - <<'PY'
          from pathlib import Path

          dist = Path('dist')
          dist.mkdir(exist_ok=True)
          index = dist / 'index.html'
          if not index.exists():
              index.write_text(
                  '''<!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>MobiDuka</title>
            </head>
            <body>
              <main style="font-family: sans-serif; padding: 2rem; text-align: center;">
                <h1>MobiDuka</h1>
                <p>Capacitor web bundle placeholder.</p>
              </main>
            </body>
          </html>
          ''',
                  encoding='utf-8',
              )
          PY

      - name: Build and sync Capacitor iOS
        run: pnpm run cap:sync:ios

      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios/App

      - name: Build unsigned iOS Simulator app
        run: >-
          xcodebuild
          -workspace ios/App/App.xcworkspace
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/build
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent ios/build/Build/Products/Debug-iphonesimulator/App.app mobiduka-ios-simulator.zip

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v5
        with:
          name: mobiduka-ios-simulator
          path: mobiduka-ios-simulator.zip