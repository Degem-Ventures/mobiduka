name: mobiduka_pos
description: MobiDuka POS interactive Flutter replica
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  fl_chart: ^0.69.0
  sqflite: ^2.4.0
  path: ^1.9.0
  path_provider: ^2.1.3
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.2
  flutter_sms_inbox: ^1.0.5
  mobile_scanner: ^5.1.1
  vibration: ^2.1.0
  bluetooth_print_plus: ^2.4.6
  pdf: ^3.11.3
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
