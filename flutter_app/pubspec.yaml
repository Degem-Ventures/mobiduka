name: mobiduka_pos
description: MobiDuka POS interactive Flutter replica
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  fl_chart: ^0.69.0
  sqflite: ^2.4.0
  path: ^1.9.0
  path_provider: ^2.1.3
  http: ^1.2.2
  sentry_flutter: ^9.30.0
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.1.3
  bcrypt: ^1.1.3
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.2
  flutter_sms_inbox: ^1.0.5
  permission_handler: ^11.3.1
  mobile_scanner: ^7.4.2
  vibration: ^2.1.0
  bluetooth_print_plus: ^2.4.6
  pdf: ^3.11.3
  printing: ^5.13.4
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.3.3

flutter_launcher_icons:
  android: true
  image_path: assets/mobiduka_icon.png
  adaptive_icon_background: '#0D1B3D'
  adaptive_icon_foreground: assets/mobiduka_icon.png
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/mobiduka_icon.svg
