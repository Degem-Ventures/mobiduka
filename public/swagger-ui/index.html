<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MobiDuka API Docs</title>
    <link rel="stylesheet" href="/swagger-ui/swagger-ui.css" />
    <style>
      html, body {
        margin: 0;
        background: #0b1220;
        color: #e5ecf7;
      }
      body {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #swagger-ui {
        max-width: 1500px;
        margin: 0 auto;
        padding: 24px;
      }
      .swagger-ui {
        background: #0b1220;
        color: #e5ecf7;
      }
      .swagger-ui .topbar {
        background: linear-gradient(135deg, #0d1b3d 0%, #123a8f 100%);
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }
      .swagger-ui .info .title,
      .swagger-ui .opblock-summary-path,
      .swagger-ui .opblock-summary-operation-id,
      .swagger-ui .parameter__name,
      .swagger-ui .response-col_status,
      .swagger-ui .table-container th,
      .swagger-ui .model-title,
      .swagger-ui .models h4,
      .swagger-ui .section-header {
        color: #e5ecf7 !important;
      }
      .swagger-ui .info .description,
      .swagger-ui .opblock-description-wrapper p,
      .swagger-ui .parameter__in,
      .swagger-ui .parameter__type,
      .swagger-ui .response-col_description,
      .swagger-ui .model .prop-name,
      .swagger-ui .model .prop-type,
      .swagger-ui .models td,
      .swagger-ui .renderedMarkdown {
        color: #c7d3eb !important;
      }
      .swagger-ui .scheme-container,
      .swagger-ui section.models,
      .swagger-ui .opblock,
      .swagger-ui .opblock-tag-section,
      .swagger-ui .model-box,
      .swagger-ui .table-container,
      .swagger-ui .parameter__value input,
      .swagger-ui textarea,
      .swagger-ui select,
      .swagger-ui .tab li,
      .swagger-ui .responses-table {
        background: #111b2e !important;
        border-color: rgba(255,255,255,0.08) !important;
        color: #e5ecf7 !important;
      }
      .swagger-ui .opblock .opblock-summary,
      .swagger-ui .opblock-summary-description,
      .swagger-ui .opblock-summary-path,
      .swagger-ui .opblock-summary-operation-id {
        color: #e5ecf7 !important;
      }
      .swagger-ui .opblock-section-header,
      .swagger-ui .opblock-section,
      .swagger-ui .parameters-container,
      .swagger-ui .opblock-description-wrapper,
      .swagger-ui .responses-wrapper,
      .swagger-ui .responses-inner,
      .swagger-ui .model-example,
      .swagger-ui .highlight-code,
      .swagger-ui .body-param__example,
      .swagger-ui .microlight,
      .swagger-ui pre,
      .swagger-ui code {
        background: #111b2e !important;
        color: #e5ecf7 !important;
      }
      .swagger-ui .tab,
      .swagger-ui .tabitem,
      .swagger-ui .tablinks,
      .swagger-ui .tab-header,
      .swagger-ui .try-out,
      .swagger-ui .content-type-wrapper {
        background: transparent !important;
        border-color: rgba(255,255,255,0.08) !important;
        color: #e5ecf7 !important;
      }
      .swagger-ui .tablinks {
        color: #c7d3eb !important;
      }
      .swagger-ui .tablinks.active,
      .swagger-ui .tabitem.active {
        background: rgba(18,58,143,0.18) !important;
        border-bottom: 2px solid #5ca7ff !important;
        color: #ffffff !important;
      }
      .swagger-ui .btn,
      .swagger-ui button {
        background: #123a8f !important;
        border-color: rgba(255,255,255,0.1) !important;
        color: #fff !important;
      }
      .swagger-ui .btn.execute {
        background: linear-gradient(135deg, #123a8f 0%, #0d1b3d 100%) !important;
      }
      .swagger-ui input,
      .swagger-ui textarea,
      .swagger-ui select {
        background: #0d1424 !important;
        color: #e5ecf7 !important;
        border-color: rgba(255,255,255,0.08) !important;
      }
      .swagger-ui .auth-btn,
      .swagger-ui .download-url-wrapper {
        background: #0d1b3d !important;
      }
      .swagger-ui .markdown code,
      .swagger-ui code {
        background: rgba(255,255,255,0.04) !important;
        color: #d1dcf6 !important;
      }
      .swagger-ui .info .title {
        color: #ffffff !important;
      }
      .swagger-ui .auth-container h4,
      .swagger-ui .auth-container input,
      .swagger-ui .auth-container textarea,
      .swagger-ui .auth-container label {
        color: #e5ecf7 !important;
      }
      .swagger-ui .parameter__name,
      .swagger-ui .parameter__in,
      .swagger-ui .parameter__type,
      .swagger-ui .response-col_status,
      .swagger-ui .response-col_description,
      .swagger-ui .opblock-title,
      .swagger-ui .opblock-description-wrapper p,
      .swagger-ui .renderedMarkdown,
      .swagger-ui .table-container th,
      .swagger-ui .table-container td,
      .swagger-ui .model-title,
      .swagger-ui .models h4,
      .swagger-ui .section-header {
        color: #e5ecf7 !important;
      }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="/swagger-ui/swagger-ui-bundle.js"></script>
    <script src="/swagger-ui/swagger-ui-standalone-preset.js"></script>
    <script>
      window.onload = function () {
        const AUTH_KEY = 'mobiduka.swagger.token';
        const DEMO_LOGIN = {
          identifier: 'owner@mobiduka.com',
          password: 'OwnerPass123',
        };

        function applyStoredToken(ui) {
          const token = localStorage.getItem(AUTH_KEY);
          if (!token) return;
          ui.preauthorizeApiKey('bearerAuth', token);
        }

        function setToken(ui, token) {
          if (!token) return;
          localStorage.setItem(AUTH_KEY, token);
          ui.preauthorizeApiKey('bearerAuth', token);
        }

        async function loginAndStoreToken(ui) {
          const existingToken = localStorage.getItem(AUTH_KEY);
          if (existingToken) {
            applyStoredToken(ui);
            return;
          }

          try {
            const response = await fetch('/api/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(DEMO_LOGIN),
            });

            const payload = await response.json();
            if (!response.ok || !payload.token) {
              throw new Error(payload.error || 'Login failed');
            }

            setToken(ui, payload.token);
          } catch (error) {
            console.warn('Swagger demo login failed:', error);
          }
        }

        const ui = window.SwaggerUIBundle({
          url: '/openapi.json',
          dom_id: '#swagger-ui',
          deepLinking: true,
          docExpansion: 'list',
          persistAuthorization: true,
          requestInterceptor: (request) => {
            const token = localStorage.getItem(AUTH_KEY);
            if (token && !request.headers.Authorization) {
              request.headers.Authorization = `Bearer ${token}`;
            }
            return request;
          },
          presets: [
            window.SwaggerUIBundle.presets.apis,
            window.SwaggerUIStandalonePreset,
          ],
          layout: 'BaseLayout',
        });

        window.ui = ui;
        ui.onComplete(() => {
          loginAndStoreToken(ui);
        });
      };
    </script>
  </body>
</html>
